apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world
  namespace: argocd

spec:
  project: olympus

  source:
    repoURL: https://github.com/danielmendozapupo/argocd-olympus.git
    targetRevision: main
    path: kubernetes/apps/hello-world/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true