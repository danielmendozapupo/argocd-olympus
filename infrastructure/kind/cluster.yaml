kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: olympus

nodes:
  - role: control-plane

    extraPortMappings:
      # HTTP ingress
      - containerPort: 80
        hostPort: 8082
        protocol: TCP

      # HTTPS ingress
      - containerPort: 443
        hostPort: 8443
        protocol: TCP